<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>pubmobile Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <a class="brand" href="#">pubmobile</a>

    <nav>
      <a class="active" href="#">Dashboard</a>
      <a href="https://github.com/pubmobile">GitHub</a>
    </nav>
  </header>


  <main>

    <section class="intro">
      <p class="label">OVERVIEW</p>

      <h1>Dashboard</h1>

      <p class="subtitle">
        Projetos e links principais.
      </p>
    </section>


    <section class="grid">

      <a class="card" href="https://github.com/pubmobile">
        <span class="card-label">GITHUB</span>

        <h2>Repositories</h2>

        <p>
          Ver projetos e código no GitHub.
        </p>

        <span class="arrow">→</span>
      </a>


      <div class="card">
        <span class="card-label">STATUS</span>

        <h2>Online</h2>

        <p>
          pubmobile.github.io
        </p>

        <span class="status">
          <i></i>
          Active
        </span>
      </div>


      <div class="card">
        <span class="card-label">INFO</span>

        <h2>Dashboard</h2>

        <p>
          Página inicial simples para organizar projetos.
        </p>
      </div>

    </section>
                                                                                                                                                                                                                                                                                              
  </main>


  <footer>
    pubmobile.github.io
  </footer>

</body>
</html>
