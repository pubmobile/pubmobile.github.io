<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>pubmobile Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <a class="brand" href="/">
      pubmobile
    </a>

    <nav class="navigation">

      <span class="active">
        Dashboard
      </span>

      <a
        href="https://github.com/pubmobile"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>

      <button
        id="dashboardFullscreenButton"
        class="nav-button"
        type="button"
        aria-label="Toggle dashboard fullscreen"
      >
        <span class="fullscreen-icon">⛶</span>
        Fullscreen
      </button>

    </nav>

  </header>


  <!-- DASHBOARD -->

  <main class="dashboard">

    <section class="intro">

      <p class="label">
        OVERVIEW
      </p>

      <h1>
        Dashboard
      </h1>

      <p class="subtitle">
        Projects and links.
      </p>

    </section>


    <section class="grid">

      <!-- PORTFOLIO -->

      <button
        class="card portfolio-card"
        type="button"
        data-window-title="PortAboutMe"
        data-window-url="/PortAboutMe/"
      >

        <span class="card-label">
          PORTFOLIO
        </span>

        <span class="card-title">
          About Me
        </span>

        <span class="card-description">
          Profile, experience and education.
        </span>

        <span class="arrow">
          →
        </span>

      </button>


      <!-- GITHUB -->

      <a
        class="card"
        href="https://github.com/pubmobile"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="card-label">
          GITHUB
        </span>

        <span class="card-title">
          Repositories
        </span>

        <span class="card-description">
          View projects and source code on GitHub.
        </span>

        <span class="arrow">
          →
        </span>

      </a>


      <!-- STATUS -->

      <div class="card">

        <span class="card-label">
          STATUS
        </span>

        <span class="card-title">
          Online
        </span>

        <span class="card-description">
          pubmobile.github.io
        </span>

        <span class="status">
          <i></i>
          Active
        </span>

      </div>


      <!-- INFO -->

      <div class="card">

        <span class="card-label">
          INFO
        </span>

        <span class="card-title">
          Dashboard
        </span>

        <span class="card-description">
          Personal hub for projects and pages.
        </span>

      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer>
    pubmobile.github.io
  </footer>


  <!-- WINDOW BACKDROP -->

  <div
    id="windowBackdrop"
    class="window-backdrop"
    aria-hidden="true"
  >

    <!-- APP WINDOW -->

    <section
      id="appWindow"
      class="app-window"
      role="dialog"
      aria-modal="true"
      aria-labelledby="windowTitle"
    >

      <!-- WINDOW TOPBAR -->

      <div class="window-topbar">

        <div class="window-info">

          <span class="window-indicator"></span>

          <span id="windowTitle" class="window-title">
            Application
          </span>

        </div>


        <div class="window-controls">

          <button
            id="windowFullscreenButton"
            class="window-button"
            type="button"
            aria-label="Toggle window fullscreen"
            title="Fullscreen"
          >
            ⛶
          </button>

          <button
            id="windowCloseButton"
            class="window-button close-button"
            type="button"
            aria-label="Close window"
            title="Close"
          >
            ×
          </button>

        </div>

      </div>


      <!-- WINDOW CONTENT -->

      <div class="window-content">

        <iframe
          id="windowFrame"
          title="Application content"
          allow="fullscreen"
        ></iframe>

      </div>

    </section>

  </div>


  <script src="script.js"></script>

</body>
</html>
